[package]
name = "skein"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
serde = "1"
serde_json = "1"
skein-core = { path = "crates/core" }
skein-api-types = { path = "crates/api-types" }
skein-cypher = { path = "crates/cypher" }
skein-ddl = { path = "crates/ddl" }
skein-executor = { path = "crates/executor" }
skein-optimizer = { path = "crates/optimizer" }
skein-plan-cache = { path = "crates/plan-cache" }
skein-qos = { path = "crates/qos" }
skein-readiness = { path = "crates/readiness" }
skein-sql = { path = "crates/sql" }
zstd = "0.13"
turbovec = { version = "0.9.0", optional = true }
loom = { version = "0.7", optional = true }

[features]
default = []
turbovec = ["dep:turbovec"]
loom-tests = ["dep:loom"]

[workspace]
members = [
  "crates/api-types",
  "crates/core",
  "crates/cypher",
  "crates/ddl",
  "crates/executor",
  "crates/optimizer",
  "crates/plan-cache",
  "crates/qos",
  "crates/readiness",
  "crates/sql",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bench]]
name = "optimizer_smoke"
harness = false
