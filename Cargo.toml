[package]
name = "skein"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
regex = "1"
serde_json = "1"
skein-core = { path = "crates/core" }
zstd = "0.13"

[workspace]
members = [
  "crates/core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bench]]
name = "optimizer_smoke"
harness = false
