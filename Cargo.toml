[package]
name = "skein"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
jieba-rs = "0.10.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simsimd = "6.5"
skein-core = { path = "crates/core" }
skein-api-types = { path = "crates/api-types" }
skein-cypher = { path = "crates/cypher" }
skein-ddl = { path = "crates/ddl" }
skein-executor = { path = "crates/executor" }
skein-optimizer = { path = "crates/optimizer" }
skein-plan = { path = "crates/plan" }
skein-plan-cache = { path = "crates/plan-cache" }
skein-qos = { path = "crates/qos" }
skein-readiness = { path = "crates/readiness" }
skein-route-ownership = { path = "crates/route-ownership" }
skein-runtime-tokio = { path = "crates/runtime-tokio", optional = true }
skein-sql = { path = "crates/sql" }
skein-storage = { path = "crates/storage" }
skein-vector-projection = { path = "crates/vector-projection", optional = true }
zstd = "0.13"
turbovec = { version = "0.9.0", optional = true }
unicode-width = "0.2.2"
loom = { version = "0.7", optional = true }
opentelemetry = { version = "0.31", default-features = false, features = ["metrics"], optional = true }

[features]
default = [
  "background-maintenance",
  "full-text-search",
  "graph-analytics",
  "vector-search",
]
acl = []
background-maintenance = []
full-text-search = []
graph-analytics = []
vector-search = ["dep:skein-vector-projection"]
turbovec = ["vector-search", "dep:turbovec"]
loom-tests = ["dep:loom"]
opentelemetry = ["dep:opentelemetry"]
tokio-runtime = ["dep:skein-runtime-tokio"]

[workspace]
members = [
  "crates/api-types",
  "crates/core",
  "crates/cypher",
  "crates/ddl",
  "crates/executor",
  "crates/fuzz",
  "crates/cgroup",
  "crates/optimizer",
  "crates/plan",
  "crates/plan-cache",
  "crates/qos",
  "crates/qualification",
  "crates/readiness",
  "crates/route-ownership",
  "crates/sql",
  "crates/storage",
  "crates/runtime-tokio",
  "crates/vector-projection",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bench]]
name = "optimizer_smoke"
harness = false

[[bench]]
name = "store_cow_feasibility"
harness = false
