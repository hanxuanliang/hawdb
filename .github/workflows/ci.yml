name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --workspace

      - name: Fixture contract checker smoke
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cat > "$root/contract.json" <<'JSON'
          {
            "protocol": "skein-nowledge-fixture-contract",
            "fixture": "mini",
            "check_count": 2,
            "setup": [],
            "checks": [
              {
                "index": 0,
                "kind": "cypher",
                "name": "first",
                "execution_mode": "database",
                "setup": [],
                "statement": {
                  "command_request": {
                    "op": "query",
                    "cypher": "MATCH (n) RETURN n",
                    "parameters": {}
                  }
                },
                "expected_rows": {
                  "kind": "row_count",
                  "count": 1
                }
              },
              {
                "index": 1,
                "kind": "cypher",
                "name": "second",
                "execution_mode": "database",
                "setup": [],
                "statement": {
                  "command_request": {
                    "op": "query",
                    "cypher": "MATCH (n) RETURN n",
                    "parameters": {}
                  }
                },
                "expected_rows": {
                  "kind": "row_count",
                  "count": 0
                }
              }
            ]
          }
          JSON
          cargo run --quiet --bin skein -- \
            nowledge-fixture-contract-command-check \
            --start-check 1 \
            "$root/contract.json" \
            python3 -c 'import json,sys; json.load(sys.stdin); print(json.dumps({"rows": []}))' \
            > "$root/selected.json"
          grep -q '"selected_subset_ready": true' "$root/selected.json"
          grep -q '"full_contract_ready": false' "$root/selected.json"
          grep -q '"full_contract_not_checked"' "$root/selected.json"
          if cargo run --quiet --bin skein -- \
            nowledge-fixture-contract-command-check \
            --require-full-contract \
            --start-check 1 \
            "$root/contract.json" \
            python3 -c 'import json,sys; json.load(sys.stdin); print(json.dumps({"rows": []}))' \
            > "$root/full.json" 2> "$root/full.err"; then
            echo "expected selected fixture slice to fail full-contract readiness"
            exit 1
          fi
          grep -q '"selected_subset_ready": true' "$root/full.json"
          grep -q '"required_contract_ready": false' "$root/full.json"
          grep -q '"required_contract_blocker_codes"' "$root/full.json"
          grep -q '"full_contract_not_checked"' "$root/full.json"
          grep -q "fixture contract command check failed" "$root/full.err"

      - name: Migration gate smoke
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/crates/nmem-graph/src"
          cat > "$root/crates/nmem-graph/src/repo.rs" <<'RS'
          pub fn query() -> &'static str {
              "MATCH (m:Memory) WHERE m.id = $id RETURN m.title AS title"
          }
          RS
          cargo run --quiet --bin skein -- \
            nowledge-cypher-migration-gate \
            --require-ready \
            --allow-self-shadow \
            --shadow-ready \
            --shadow-trace "$root/shadow.jsonl" \
            "$root" \
            self \
            cargo run --quiet --bin skein-shadow-self -- \
            > "$root/gate.json"
          grep -q '"decision": "ready"' "$root/gate.json"
          grep -q '"shadow_run"' "$root/gate.json"
          grep -q '"evidence_kind": "protocol_smoke"' "$root/gate.json"
          grep -q '"self_shadow": true' "$root/gate.json"
          grep -q '"cutover_evidence"' "$root/gate.json"
          grep -q '"eligible": false' "$root/gate.json"
          grep -q '"shadow_ready"' "$root/gate.json"
          grep -q '"shadow_trace"' "$root/gate.json"
          grep -q '"request_count"' "$root/gate.json"
          grep -q '"project_graph"' "$root/gate.json"
          test -s "$root/shadow.jsonl"
          if cargo run --quiet --bin skein -- \
            nowledge-replacement-summary \
            --require-production-ready \
            "$root/gate.json" \
            > "$root/replacement.json" 2> "$root/replacement.err"; then
            echo "expected protocol smoke replacement summary to fail production readiness"
            exit 1
          fi
          grep -q '"production_cutover_ready": false' "$root/replacement.json"
          grep -q '"production_replacement_per_million": 0' "$root/replacement.json"
          grep -q '"cutover_evidence"' "$root/replacement.json"
          grep -q "nowledge replacement summary is not production cutover ready" "$root/replacement.err"

      - name: Migration gate blocked smoke
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/crates/nmem-graph/src"
          cat > "$root/crates/nmem-graph/src/repo.rs" <<'RS'
          pub fn query() -> &'static str {
              "MATCH (m:Memory) WHERE m.id = $id RETURN m.uncovered_property"
          }
          RS
          if cargo run --quiet --bin skein -- \
            nowledge-cypher-migration-gate \
            --require-ready \
            --allow-self-shadow \
            "$root" \
            self \
            cargo run --quiet --bin skein-shadow-self -- \
            > "$root/gate.json" 2> "$root/gate.err"; then
            echo "expected blocked migration gate to fail"
            exit 1
          fi
          grep -q '"decision": "blocked"' "$root/gate.json"
          grep -q '"shadow_run"' "$root/gate.json"
          grep -q '"evidence_kind": "protocol_smoke"' "$root/gate.json"
          grep -q '"cutover_evidence"' "$root/gate.json"
          grep -q '"eligible": false' "$root/gate.json"
          grep -q '"shadow_ready"' "$root/gate.json"
          grep -q "nowledge migration gate is blocked" "$root/gate.err"
