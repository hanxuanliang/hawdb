name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --workspace

      - name: Migration gate smoke
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/crates/nmem-graph/src"
          cat > "$root/crates/nmem-graph/src/repo.rs" <<'RS'
          pub fn query() -> &'static str {
              "MATCH (m:Memory) WHERE m.id = $id RETURN m.title AS title"
          }
          RS
          cargo run --quiet --bin skein -- \
            nowledge-cypher-migration-gate \
            --require-ready \
            "$root" \
            self \
            cargo run --quiet --bin skein-shadow-self -- \
            > "$root/gate.json"
