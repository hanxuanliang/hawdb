[package]
name = "hawdb-ffi"
publish = false
# Tracks the hawdb engine version; hawdb_version() reports this string.
version = "0.5.0"

description = "C ABI bindings for the HawDB embedded database"
edition = "2024"
license = "Apache-2.0"

# Keep the binding outside the HawDB workspace: it builds with its own
# lockfile so hosts can compile it without the workspace's toolchain pins.
[workspace]

[lib]
# "rlib" lets the workspace-local benches and tests link this crate;
# cdylib/staticlib remain the only shipped artifacts.
crate-type = ["cdylib", "staticlib", "rlib"]

[[bench]]
name = "boundary"
harness = false

[dependencies]
hawdb = { path = "../.." }
base64 = "0.22"
# float_roundtrip: the default parser can misround by 1 ulp (e.g.
# "445.85714285714283" parses 0x1 below), which silently corrupts float
# parameters crossing the boundary. Exact round-trip is worth the parse
# cost at this scale.
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
libc = "0.2"

[build-dependencies]
cbindgen = "0.29"
